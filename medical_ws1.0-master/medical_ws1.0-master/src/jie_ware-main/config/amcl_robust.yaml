# ROS1 AMCL configuration for a mecanum base in a cluttered competition field.
# Load this file inside the AMCL node's private namespace.

global_frame_id: map
odom_frame_id: odom
base_frame_id: base_footprint
tf_broadcast: true
transform_tolerance: 0.20

# Mecanum / omnidirectional wheel odometry model.
odom_model_type: omni-corrected
odom_alpha1: 0.10
odom_alpha2: 0.10
odom_alpha3: 0.15
odom_alpha4: 0.10
odom_alpha5: 0.10

# Particle filter.  This range is a reasonable starting point for Jetson Orin.
min_particles: 500
max_particles: 2000
kld_err: 0.03
kld_z: 0.99
resample_interval: 1
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0

# Update often enough to follow the chassis without using every tiny encoder
# fluctuation as a new laser update.
update_min_d: 0.03
update_min_a: 0.03
gui_publish_rate: 10.0
save_pose_rate: 0.5

# likelihood_field_prob is required for ROS1 AMCL beam skipping.  Beams that
# disagree with most converged particles (people and newly placed boxes) are
# prevented from pulling the correct particle cluster away from the map.
laser_model_type: likelihood_field_prob
do_beamskip: true
beam_skip_distance: 0.30
beam_skip_threshold: 0.30
beam_skip_error_threshold: 0.90

laser_min_range: -1.0
laser_max_range: -1.0
laser_max_beams: 120
laser_z_hit: 0.90
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.10
laser_sigma_hit: 0.20
laser_lambda_short: 0.10
laser_likelihood_max_dist: 1.0

use_map_topic: false
first_map_only: false

