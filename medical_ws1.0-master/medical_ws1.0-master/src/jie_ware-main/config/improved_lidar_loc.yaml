# 改进激光雷达定位算法配置

# 坐标系
map_frame: "map"
odom_frame: "odom"
base_frame: "base_footprint"
laser_frame: "laser"

# 动态障碍物过滤参数 (智能过滤，避免初始漂移)
outlier_filter_enabled: true       # 是否启用外点过滤
outlier_ratio_threshold: 0.4       # 外点比例阈值 - 提高以避免过度过滤
consistency_check_radius: 3        # 地图一致性检查半径 - 增大容错性

# 匹配参数（基于原始算法的成功设置）
search_range: 1                     # 搜索范围 (栅格)
angle_search_step: 1.0              # 角度搜索步长 (度)

# 运动预测和稳定性参数 (优化移动时稳定性)
motion_prediction_enabled: false   # 禁用运动预测避免过度补偿
velocity_filter_window: 5          # 增大速度滤波窗口
max_position_change_per_frame: 5   # 减小每帧最大位置变化
max_angle_change_per_frame: 5      # 减小每帧最大角度变化
convergence_threshold: 2           # 降低收敛阈值提高精度
max_iterations: 50                 # 增加最大迭代次数

# 性能参数 (降低频率提高稳定性)
tf_publish_rate: 20.0               # TF发布频率 (Hz) - 降低减少抖动
pose_publish_rate: 5.0              # 位姿发布频率 (Hz) - 降低避免频繁更新

# 调试选项 (启用以监控过滤效果)
debug_mode: true                   # 启用调试模式
verbose_logging: true              # 启用详细日志
publish_filtered_scan: true       # 发布过滤后的激光数据用于监控
